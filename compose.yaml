services:
  backend:
    container_name: rca-ai-api
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
    command: ["uvicorn", "rca_ai.api.demo:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    container_name: rca-ai-web
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    environment:
      RCA_DEMO_API_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - rca_ai_frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-3000}:5173"
    restart: unless-stopped

volumes:
  rca_ai_frontend_node_modules:
